# MRG-ViT--Mamba on DAiSEE -- master configuration.
#
# Every value here is a *starting point* recorded so runs are reproducible.
# None of these numbers are claimed to be optimal. Anything the code discovers
# at runtime (ViT embedding dim, landmark feature dim, actual FPS) is NOT set
# here -- it is written to artifacts/ after being measured.

seed: 42

paths:
  # Relative to the repository root (the directory containing this configs/ dir).
  dataset_root: "../Datasets/DAiSEE_mini"
  cache_dir: "cache"
  artifacts_dir: "artifacts"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  models_dir: "models"

dataset:
  name: "DAiSEE"
  num_classes: 4
  target_label: "Engagement"      # spec section 2.2: engagement only
  video_extensions: [".avi", ".mp4"]
  # DAiSEE ships its own Train/Validation/Test directory split. We use it as-is
  # and verify subject disjointness rather than re-splitting (spec section 6).
  split_dirs:
    train: "DataSet/Train"
    val: "DataSet/Validation"
    test: "DataSet/Test"
  label_files:
    train: "Labels/TrainLabels.csv"
    val: "Labels/ValidationLabels.csv"
    test: "Labels/TestLabels.csv"

video:
  num_frames: 16                  # configurable: 8 / 16 / 32 / 64 (spec section 8)
  sampling: "uniform"             # uniform only for the reproducible pipeline

face:
  detector: "mediapipe_face_detector"
  image_size: 224                 # overridden per-backbone by the ViT's own cfg
  min_detection_confidence: 0.3
  crop_padding: 0.25              # fraction of box size added on each side
  align: true                     # roll-align using the two eye landmarks
  # Policy when no face is found in a frame (spec section 9). We never drop the
  # temporal position; we fall back and mark the frame as unreliable.
  missing_face_policy: "center_crop"

mrs:
  weights:
    blur: 0.2
    face_visibility: 0.2
    head_pose: 0.2
    eye_visibility: 0.2
    motion_consistency: 0.2
  weighting_mode: "multiply"      # multiply | none | residual  (none = ablation baseline)
  residual_floor: 0.2             # only used when weighting_mode == "residual"
  # Blur sharpness and face size have no dataset-independent scale, so both are
  # mapped through percentiles fitted on the TRAINING split only (spec Rule 8),
  # by scripts/fit_mrs_stats.py. Head pose is in physical degrees, so it is not
  # fitted.
  calibration_file: "artifacts/mrs_calibration.json"
  calibration_percentiles: [5.0, 95.0]
  # Learn the five component weights end to end, starting from 0.2 each.
  # See LearnableMRSWeights in src/model.py for the semantic caveat.
  learnable_weights: true
  head_pose_full_reliability_deg: 15.0   # |angle| below this -> reliability 1.0
  head_pose_zero_reliability_deg: 60.0   # |angle| above this -> reliability 0.0
  motion_ref_displacement: 0.08          # normalised landmark displacement/s -> M=0

landmarks:
  model_bundle: "models/face_landmarker.task"
  num_faces: 1
  output_blendshapes: true
  output_transformation_matrix: true
  min_face_detection_confidence: 0.3
  min_face_presence_confidence: 0.3
  min_tracking_confidence: 0.3

vit:
  # timm model name. Verified-available choices are listed in
  # artifacts/backbone_benchmark.json after scripts/compare_backbones.py runs.
  model_name: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
  pretrained: true
  freeze: true                    # spec section 13: freeze first, fine-tune later
  batch_size: 32                  # frames per ViT forward chunk

mamba:
  # Vendored pure-PyTorch reference implementation of the official
  # state-spaces/mamba selective SSM. See src/mamba_ref.py and README.
  d_model: 256
  n_layers: 2
  d_state: 16
  d_conv: 4
  expand: 2
  bidirectional: false            # true = Vim-style bi-directional scan (ablation)
  dropout: 0.1
  # mean | last | attention | mrs_weighted.
  # "mrs_weighted" pools as sum_t r_t h_t / sum_t r_t. See the note in
  # src/temporal_mamba.py: a scale-invariant norm cancels pure feature
  # multiplication, so this is where reliability actually takes effect.
  pooling: "mrs_weighted"

fusion:
  projected_dim: 256
  mode: "concat"                  # concat | gated
  dropout: 0.1
  use_landmark_branch: true
  landmark_norm: "standard"       # standardise with train-split statistics
  deep_norm: "layernorm"

classifier:
  hidden_dims: [256, 128]
  activation: "gelu"
  dropout: 0.3

training:
  batch_size: 8
  epochs: 64
  learning_rate: 0.0003
  mrs_weight_lr: 0.02        # separate LR for the 5 MRS weights
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 3
  grad_clip: 1.0
  mixed_precision: true           # only enabled when CUDA is actually present
  class_weighting: "inverse_frequency"   # none | inverse_frequency | effective_number
  label_smoothing: 0.05
  early_stopping_patience: 64   # run the full 64 epochs as requested
  model_selection_metric: "val_macro_f1"  # never test performance (spec section 29)
  num_workers: 0                  # Windows: keep 0 unless verified safe

evaluation:
  metrics: [accuracy, weighted_f1, macro_f1, per_class_precision, per_class_recall, per_class_f1]
  timing_repeats: 20
  timing_warmup: 5

explain:
  shap_background_size: 64
  shap_eval_size: 64
